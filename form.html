<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form | WDD 131</title>
    <meta name="description" content="Product Review Form for WDD 131 by Okorie Emmanuel. Submit product feedback with dynamic ratings, feature checks, and submission tracking.">
    <meta name="author" content="Okorie Emmanuel">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <div class="header-container">
            <span class="site-tag">WDD 131 Assignment</span>
        </div>
    </header>

    <main>
        <div class="form-card">
            <div class="form-header">
                <h1>Product Review</h1>
            </div>

            <form method="get" action="review.html" class="review-form">
                <!-- Product Name Selection -->
                <div class="form-group">
                    <label for="product-select">Product Name <span class="required-indicator" title="Required field">*</span></label>
                    <select id="product-select" name="product-name" required>
                        <option value="" disabled selected>Select a Product ...</option>
                    </select>
                </div>

                <!-- Overall Rating -->
                <fieldset class="form-group rating-fieldset">
                    <legend>Overall Rating <span class="required-indicator" title="Required field">*</span></legend>
                    <div class="rating-group">
                        <label for="rating-1" class="rating-option">
                            <span class="star-display" aria-hidden="true">&star;</span>
                            <input type="radio" id="rating-1" name="rating" value="1" required>
                            <span class="sr-only">1 Star</span>
                        </label>
                        <label for="rating-2" class="rating-option">
                            <span class="star-display" aria-hidden="true">&star;&star;</span>
                            <input type="radio" id="rating-2" name="rating" value="2" required>
                            <span class="sr-only">2 Stars</span>
                        </label>
                        <label for="rating-3" class="rating-option">
                            <span class="star-display" aria-hidden="true">&star;&star;&star;</span>
                            <input type="radio" id="rating-3" name="rating" value="3" required>
                            <span class="sr-only">3 Stars</span>
                        </label>
                        <label for="rating-4" class="rating-option">
                            <span class="star-display" aria-hidden="true">&star;&star;&star;&star;</span>
                            <input type="radio" id="rating-4" name="rating" value="4" required>
                            <span class="sr-only">4 Stars</span>
                        </label>
                        <label for="rating-5" class="rating-option">
                            <span class="star-display" aria-hidden="true">&star;&star;&star;&star;&star;</span>
                            <input type="radio" id="rating-5" name="rating" value="5" required>
                            <span class="sr-only">5 Stars</span>
                        </label>
                    </div>
                </fieldset>

                <!-- Date of Installation -->
                <div class="form-group">
                    <label for="install-date">Date of Installation <span class="required-indicator" title="Required field">*</span></label>
                    <input type="date" id="install-date" name="install-date" required>
                </div>

                <!-- Useful Features -->
                <fieldset class="form-group features-fieldset">
                    <legend>Which features did you find useful in the product? <span class="subtext">(Check all that apply)</span></legend>
                    <div class="checkbox-group">
                        <div class="checkbox-option">
                            <input type="checkbox" id="feature-durability" name="features" value="durability">
                            <label for="feature-durability">Durability</label>
                        </div>
                        <div class="checkbox-option">
                            <input type="checkbox" id="feature-ease" name="features" value="ease-of-use">
                            <label for="feature-ease">Ease of Use</label>
                        </div>
                        <div class="checkbox-option">
                            <input type="checkbox" id="feature-performance" name="features" value="performance">
                            <label for="feature-performance">Performance</label>
                        </div>
                        <div class="checkbox-option">
                            <input type="checkbox" id="feature-design" name="features" value="design">
                            <label for="feature-design">Design</label>
                        </div>
                    </div>
                </fieldset>

                <!-- Written Review -->
                <div class="form-group">
                    <label for="written-review">Written Review <span class="optional-indicator">(Optional)</span></label>
                    <textarea id="written-review" name="written-review" rows="5" placeholder="Share your experience with this product..."></textarea>
                </div>

                <!-- User Name -->
                <div class="form-group">
                    <label for="user-name">Your Name <span class="optional-indicator">(Optional)</span></label>
                    <input type="text" id="user-name" name="user-name" autocomplete="name" placeholder="Enter your full name">
                </div>

                <!-- Submit Button -->
                <div class="form-group submit-group">
                    <input type="submit" id="submit-review" value="Post Review">
                </div>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy;<span id="currentyear"></span> 🌸 Okorie Emmanuel 🌸 Lagos, Nigeria</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
