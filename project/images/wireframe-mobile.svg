<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 920" width="380" height="920" aria-label="Mobile Wireframe Diagram for Zen Café Lagos">
  <defs>
    <pattern id="crosshatch" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 0 0 L 16 16 M 16 0 L 0 16" fill="none" stroke="#D1D5DB" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Device Frame -->
  <rect x="5" y="5" width="370" height="910" rx="24" fill="#FFFFFF" stroke="#374151" stroke-width="3"/>
  <!-- Status Bar / Speaker -->
  <rect x="140" y="14" width="100" height="5" rx="2.5" fill="#9CA3AF"/>

  <!-- Top Title / Wireframe Label -->
  <text x="190" y="38" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" fill="#4B5563">MOBILE VIEW WIREFRAME (375px - 600px)</text>

  <!-- 1. Header (Sticky) -->
  <g transform="translate(15, 48)">
    <rect x="0" y="0" width="350" height="50" rx="4" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.5"/>
    <rect x="12" y="12" width="110" height="26" rx="3" fill="#D1D5DB" stroke="#6B7280" stroke-width="1"/>
    <text x="67" y="29" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#374151">[ Logo &amp; Name ]</text>
    <!-- Hamburger button -->
    <rect x="306" y="11" width="32" height="28" rx="4" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
    <line x1="312" y1="18" x2="332" y2="18" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    <line x1="312" y1="25" x2="332" y2="25" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    <line x1="312" y1="32" x2="332" y2="32" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- 2. Hero Section -->
  <g transform="translate(15, 106)">
    <rect x="0" y="0" width="350" height="195" rx="4" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
    <!-- Image Box -->
    <rect x="15" y="12" width="320" height="95" rx="4" fill="url(#crosshatch)" stroke="#9CA3AF" stroke-width="1"/>
    <text x="175" y="64" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#4B5563">[ Hero Banner: Café Interior / Fresh Food ]</text>
    <!-- Heading -->
    <rect x="40" y="116" width="270" height="18" rx="3" fill="#D1D5DB"/>
    <text x="175" y="130" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1F2937">H1: Catchy Headline &amp; Tagline</text>
    <!-- Subtitle text lines -->
    <line x1="60" y1="144" x2="290" y2="144" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round"/>
    <line x1="80" y1="154" x2="270" y2="154" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round"/>
    <!-- CTA Button -->
    <rect x="95" y="165" width="160" height="22" rx="4" fill="#6B7280"/>
    <text x="175" y="180" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">CTA: Explore Menu &amp; Reserve</text>
  </g>

  <!-- 3. Key Offerings / Cards (Stacked Single Column) -->
  <g transform="translate(15, 309)">
    <rect x="0" y="0" width="350" height="315" rx="4" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
    <text x="175" y="20" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1F2937">H2: Our Core Offerings</text>

    <!-- Card 1 -->
    <g transform="translate(15, 30)">
      <rect x="0" y="0" width="320" height="82" rx="4" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
      <rect x="8" y="8" width="80" height="66" rx="3" fill="url(#crosshatch)" stroke="#9CA3AF" stroke-width="1"/>
      <text x="48" y="46" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#4B5563">[ Image ]</text>
      <text x="100" y="24" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1F2937">Artisan Coffee &amp; Teas</text>
      <line x1="100" y1="36" x2="305" y2="36" stroke="#9CA3AF" stroke-width="2.5"/>
      <line x1="100" y1="46" x2="280" y2="46" stroke="#9CA3AF" stroke-width="2.5"/>
      <text x="100" y="64" font-family="sans-serif" font-size="9" font-weight="bold" fill="#4B5563">Learn More &gt;</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(15, 122)">
      <rect x="0" y="0" width="320" height="82" rx="4" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
      <rect x="8" y="8" width="80" height="66" rx="3" fill="url(#crosshatch)" stroke="#9CA3AF" stroke-width="1"/>
      <text x="48" y="46" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#4B5563">[ Image ]</text>
      <text x="100" y="24" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1F2937">Organic Smoothie Bowls</text>
      <line x1="100" y1="36" x2="305" y2="36" stroke="#9CA3AF" stroke-width="2.5"/>
      <line x1="100" y1="46" x2="280" y2="46" stroke="#9CA3AF" stroke-width="2.5"/>
      <text x="100" y="64" font-family="sans-serif" font-size="9" font-weight="bold" fill="#4B5563">Learn More &gt;</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(15, 214)">
      <rect x="0" y="0" width="320" height="82" rx="4" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
      <rect x="8" y="8" width="80" height="66" rx="3" fill="url(#crosshatch)" stroke="#9CA3AF" stroke-width="1"/>
      <text x="48" y="46" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#4B5563">[ Image ]</text>
      <text x="100" y="24" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1F2937">Quiet Co-Working Space</text>
      <line x1="100" y1="36" x2="305" y2="36" stroke="#9CA3AF" stroke-width="2.5"/>
      <line x1="100" y1="46" x2="280" y2="46" stroke="#9CA3AF" stroke-width="2.5"/>
      <text x="100" y="64" font-family="sans-serif" font-size="9" font-weight="bold" fill="#4B5563">Learn More &gt;</text>
    </g>
  </g>

  <!-- 4. Location & Contact / Reservation Teaser -->
  <g transform="translate(15, 632)">
    <rect x="0" y="0" width="350" height="135" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
    <text x="175" y="22" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1F2937">H2: Visit Us in Lekki, Lagos</text>
    <!-- Map placeholder -->
    <rect x="15" y="32" width="140" height="90" rx="3" fill="url(#crosshatch)" stroke="#9CA3AF" stroke-width="1"/>
    <text x="85" y="80" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4B5563">[ Map View ]</text>
    <!-- Details -->
    <text x="168" y="48" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1F2937">Hours &amp; Location:</text>
    <line x1="168" y1="60" x2="330" y2="60" stroke="#9CA3AF" stroke-width="2"/>
    <line x1="168" y1="70" x2="310" y2="70" stroke="#9CA3AF" stroke-width="2"/>
    <rect x="168" y="86" width="150" height="26" rx="4" fill="#6B7280"/>
    <text x="243" y="103" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">Book a Desk / Table</text>
  </g>

  <!-- 5. Footer -->
  <g transform="translate(15, 775)">
    <rect x="0" y="0" width="350" height="95" rx="4" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.5"/>
    <text x="175" y="24" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1F2937">Zen Café Lagos</text>
    <line x1="60" y1="36" x2="290" y2="36" stroke="#9CA3AF" stroke-width="1.5"/>
    <!-- Nav Links -->
    <text x="175" y="52" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#4B5563">Home | Menu | Co-Working | Contact</text>
    <text x="175" y="68" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#4B5563">© 2026 Okorie Emmanuel | Lagos, Nigeria</text>
    <text x="175" y="82" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#6B7280">Last Modification: [Dynamic Date]</text>
  </g>

  <!-- Home Indicator Bar -->
  <rect x="135" y="895" width="110" height="4" rx="2" fill="#4B5563"/>
</svg>
