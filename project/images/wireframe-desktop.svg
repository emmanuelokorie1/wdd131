<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 780" width="960" height="780" aria-label="Desktop Wireframe Diagram for Zen Café Lagos">
  <defs>
    <pattern id="desktop-crosshatch" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 0 0 L 16 16 M 16 0 L 0 16" fill="none" stroke="#D1D5DB" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Desktop Browser Frame -->
  <rect x="5" y="5" width="950" height="770" rx="12" fill="#FFFFFF" stroke="#374151" stroke-width="2.5"/>
  <!-- Browser Header & Dots -->
  <rect x="5" y="5" width="950" height="38" rx="12" fill="#E5E7EB" stroke="#D1D5DB" stroke-width="1"/>
  <circle cx="28" cy="24" r="5.5" fill="#EF4444"/>
  <circle cx="46" cy="24" r="5.5" fill="#F59E0B"/>
  <circle cx="64" cy="24" r="5.5" fill="#10B981"/>
  <!-- URL Bar -->
  <rect x="180" y="14" width="600" height="20" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/>
  <text x="480" y="28" text-anchor="middle" font-family="monospace" font-size="11" fill="#4B5563">https://emmanuelokorie1.github.io/wdd131/project/</text>

  <!-- Title / Label -->
  <text x="480" y="62" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="13" font-weight="700" fill="#374151">DESKTOP VIEW WIREFRAME (Wider Viewports $\ge$ 960px)</text>

  <!-- 1. Header & Navigation Bar -->
  <g transform="translate(25, 75)">
    <rect x="0" y="0" width="910" height="54" rx="4" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
    <!-- Logo -->
    <rect x="18" y="11" width="160" height="32" rx="4" fill="#D1D5DB" stroke="#6B7280" stroke-width="1"/>
    <text x="98" y="32" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1F2937">[ Zen Café Lagos Logo ]</text>
    <!-- Nav Links (Horizontal) -->
    <text x="560" y="33" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1F2937">Home</text>
    <text x="635" y="33" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4B5563">Menu &amp; Specials</text>
    <text x="735" y="33" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4B5563">Co-Working</text>
    <!-- CTA button -->
    <rect x="800" y="11" width="95" height="32" rx="4" fill="#4B5563"/>
    <text x="847" y="32" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">Reserve</text>
  </g>

  <!-- 2. Hero Section (2-Column Grid) -->
  <g transform="translate(25, 137)">
    <rect x="0" y="0" width="910" height="195" rx="4" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
    
    <!-- Hero Left: Content -->
    <g transform="translate(30, 25)">
      <rect x="0" y="0" width="120" height="20" rx="3" fill="#E5E7EB"/>
      <text x="60" y="14" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#4B5563">LEKKI, LAGOS</text>
      <!-- H1 Headline -->
      <rect x="0" y="30" width="380" height="26" rx="4" fill="#D1D5DB"/>
      <text x="190" y="48" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#111827">H1: Eat Fresh. Live Zen. Work Inspired.</text>
      <!-- Paragraph -->
      <line x1="0" y1="70" x2="420" y2="70" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="84" x2="390" y2="84" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="98" x2="340" y2="98" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round"/>
      <!-- Dual CTA Buttons -->
      <rect x="0" y="118" width="140" height="32" rx="4" fill="#1F2937"/>
      <text x="70" y="139" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">Explore Menu</text>
      <rect x="155" y="118" width="140" height="32" rx="4" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.5"/>
      <text x="225" y="139" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1F2937">Book a Workspace</text>
    </g>

    <!-- Hero Right: Image with Badge -->
    <g transform="translate(485, 18)">
      <rect x="0" y="0" width="395" height="158" rx="4" fill="url(#desktop-crosshatch)" stroke="#9CA3AF" stroke-width="1"/>
      <text x="197" y="85" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#4B5563">[ Hero Image: Serene Café &amp; Organic Food ]</text>
    </g>
  </g>

  <!-- 3. Key Offerings (3-Column Grid) -->
  <g transform="translate(25, 340)">
    <rect x="0" y="0" width="910" height="185" rx="4" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
    <text x="455" y="24" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1F2937">H2: Crafted for Well-being &amp; Productivity</text>

    <!-- Card 1 -->
    <g transform="translate(25, 38)">
      <rect x="0" y="0" width="270" height="132" rx="4" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
      <rect x="12" y="10" width="246" height="58" rx="3" fill="url(#desktop-crosshatch)" stroke="#9CA3AF" stroke-width="1"/>
      <text x="135" y="44" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4B5563">[ Image: Specialty Brews ]</text>
      <text x="135" y="86" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1F2937">Artisan Coffee &amp; Teas</text>
      <line x1="25" y1="98" x2="245" y2="98" stroke="#9CA3AF" stroke-width="2"/>
      <line x1="45" y1="106" x2="225" y2="106" stroke="#9CA3AF" stroke-width="2"/>
      <text x="135" y="122" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#4B5563">View Coffee Menu &gt;</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(320, 38)">
      <rect x="0" y="0" width="270" height="132" rx="4" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
      <rect x="12" y="10" width="246" height="58" rx="3" fill="url(#desktop-crosshatch)" stroke="#9CA3AF" stroke-width="1"/>
      <text x="135" y="44" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4B5563">[ Image: Smoothie Bowls ]</text>
      <text x="135" y="86" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1F2937">Organic Smoothie Bowls</text>
      <line x1="25" y1="98" x2="245" y2="98" stroke="#9CA3AF" stroke-width="2"/>
      <line x1="45" y1="106" x2="225" y2="106" stroke="#9CA3AF" stroke-width="2"/>
      <text x="135" y="122" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#4B5563">View Healthy Bowls &gt;</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(615, 38)">
      <rect x="0" y="0" width="270" height="132" rx="4" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
      <rect x="12" y="10" width="246" height="58" rx="3" fill="url(#desktop-crosshatch)" stroke="#9CA3AF" stroke-width="1"/>
      <text x="135" y="44" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4B5563">[ Image: Co-Working Nook ]</text>
      <text x="135" y="86" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1F2937">Quiet Co-Working Space</text>
      <line x1="25" y1="98" x2="245" y2="98" stroke="#9CA3AF" stroke-width="2"/>
      <line x1="45" y1="106" x2="225" y2="106" stroke="#9CA3AF" stroke-width="2"/>
      <text x="135" y="122" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#4B5563">Workspace Rates &gt;</text>
    </g>
  </g>

  <!-- 4. Split Story & Reservation Section (2-Column Grid) -->
  <g transform="translate(25, 533)">
    <rect x="0" y="0" width="910" height="145" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>

    <!-- Left: Philosophy Story -->
    <g transform="translate(30, 20)">
      <text x="0" y="16" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1F2937">H2: Our Mindful Story</text>
      <line x1="0" y1="32" x2="380" y2="32" stroke="#9CA3AF" stroke-width="2.5"/>
      <line x1="0" y1="44" x2="350" y2="44" stroke="#9CA3AF" stroke-width="2.5"/>
      <line x1="0" y1="56" x2="370" y2="56" stroke="#9CA3AF" stroke-width="2.5"/>
      <line x1="0" y1="68" x2="310" y2="68" stroke="#9CA3AF" stroke-width="2.5"/>
      <text x="0" y="94" font-family="sans-serif" font-size="10" font-weight="bold" fill="#4B5563">📍 Admiralty Way, Lekki Phase 1, Lagos</text>
      <text x="0" y="110" font-family="sans-serif" font-size="10" fill="#4B5563">⏰ Mon – Sat: 7:30 AM – 9:00 PM | Sun: 9:00 AM – 7:00 PM</text>
    </g>

    <!-- Right: Quick Interactive Reservation Box -->
    <g transform="translate(490, 16)">
      <rect x="0" y="0" width="390" height="114" rx="4" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1"/>
      <text x="195" y="24" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1F2937">Table &amp; Desk Reservations</text>
      <!-- Form Input Simulation -->
      <rect x="25" y="38" width="165" height="26" rx="3" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/>
      <text x="35" y="55" font-family="sans-serif" font-size="9" fill="#9CA3AF">[ Select Date &amp; Time ]</text>
      <rect x="200" y="38" width="165" height="26" rx="3" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/>
      <text x="210" y="55" font-family="sans-serif" font-size="9" fill="#9CA3AF">[ Guests / Desk Type ]</text>
      <!-- Button -->
      <rect x="115" y="74" width="160" height="28" rx="4" fill="#1F2937"/>
      <text x="195" y="92" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">Check Availability</text>
    </g>
  </g>

  <!-- 5. Footer (3-Column Multi-layout) -->
  <g transform="translate(25, 686)">
    <rect x="0" y="0" width="910" height="78" rx="4" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.5"/>
    <!-- Col 1 -->
    <text x="30" y="26" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1F2937">Zen Café Lagos</text>
    <text x="30" y="44" font-family="sans-serif" font-size="9" fill="#4B5563">Specialty Roastery &amp; Workspace in Lekki</text>
    <text x="30" y="60" font-family="sans-serif" font-size="9" fill="#6B7280">© 2026 Okorie Emmanuel | Lagos, Nigeria</text>

    <!-- Col 2 -->
    <text x="380" y="26" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1F2937">Quick Navigation</text>
    <text x="380" y="44" font-family="sans-serif" font-size="9" fill="#4B5563">Home | Menu &amp; Specials | Co-Working | Contact &amp; Reserve</text>
    <text x="380" y="60" font-family="sans-serif" font-size="9" fill="#6B7280">References &amp; Attribution Page</text>

    <!-- Col 3 -->
    <text x="730" y="26" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1F2937">Operating Hours</text>
    <text x="730" y="44" font-family="sans-serif" font-size="9" fill="#4B5563">Mon–Sat: 7:30 AM – 9:00 PM</text>
    <text x="730" y="60" font-family="sans-serif" font-size="9" fill="#6B7280">Last Modification: [Dynamic Date]</text>
  </g>
</svg>
