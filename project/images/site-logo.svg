<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 70" width="280" height="70" aria-label="Zen Café Lagos Logo">
  <rect width="100%" height="100%" fill="none"/>
  <!-- Leaf and Coffee Cup Icon -->
  <g transform="translate(10, 10)">
    <!-- Cup Body -->
    <path d="M 10 20 Q 10 45, 30 45 Q 50 45, 50 20 Z" fill="#1B4332" />
    <!-- Handle -->
    <path d="M 50 24 Q 60 24, 60 32 Q 60 40, 50 40" fill="none" stroke="#1B4332" stroke-width="4" stroke-linecap="round"/>
    <!-- Saucer -->
    <path d="M 5 48 Q 30 52, 55 48" fill="none" stroke="#C86D51" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Steam / Zen Leaf -->
    <path d="M 24 16 C 24 8, 30 5, 30 5 C 30 5, 36 8, 36 16 C 36 21, 24 21, 24 16 Z" fill="#C86D51"/>
  </g>
  <!-- Text Brand -->
  <text x="80" y="34" font-family="'Montserrat', sans-serif" font-size="22" font-weight="700" fill="#1B4332">ZEN CAFÉ</text>
  <text x="82" y="52" font-family="'Montserrat', sans-serif" font-size="12" font-weight="600" fill="#C86D51" letter-spacing="3">LAGOS</text>
</svg>
